<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Logic Visualizer</title>

    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #111;
        font-family: sans-serif;
      }
      #ui {
        position: absolute;
        left: 10px;
        top: 10px;
        width: 400px;
        height: calc(100vh - 20px);
        display: flex;
        flex-direction: column;
        z-index: 10;
      }
      textarea {
        flex: 1;
        background: #222;
        color: white;
        border: none;
        resize: none;
        font-family: monospace;
      }
      button {
        height: 40px;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.179.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.179.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="ui">
      <textarea id="text"></textarea>
      <button id="render">Render</button>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111111);

      const camera = new THREE.PerspectiveCamera(
        60,
        innerWidth / innerHeight,
        0.1,
        1000,
      );

      camera.position.set(15, 15, 15);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(8, 3, 0);

      scene.add(new THREE.AmbientLight(0xffffff, 1));

      const light = new THREE.DirectionalLight(0xffffff, 2);
      light.position.set(20, 20, 20);
      scene.add(light);

      window.onresize = () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      };

      function gateColor(type) {
        return (
          {
            IN: 0x44ff44,
            OUT: 0xffaa00,
            XOR: 0x3399ff,
            AND: 0xff3366,
            OR: 0xaa44ff,
          }[type] ?? 0x888888
        );
      }

      let objects = [];

      function clearScene() {
        for (const o of objects) scene.remove(o);
        objects = [];
      }

      function renderCircuit() {
        clearScene();

        const nodes = {};

        for (const line of text.value.split("\n")) {
          const s = line.trim();
          if (!s || s.startsWith("#")) continue;

          const m = s.match(/^(\d+):\s+(.*)$/);
          if (!m) continue;

          const id = +m[1];
          const p = m[2].split(/\s+/);

          if (p[0] == "IN") {
            nodes[id] = {
              id,
              type: "IN",
              x: +p[1],
              y: +p[2],
              z: +p[3],
              inputs: [],
            };
          } else if (p[0] == "OUT") {
            nodes[id] = {
              id,
              type: "OUT",
              x: +p[1],
              y: +p[2],
              z: +p[3],
              inputs: [+p[5]],
            };
          } else {
            nodes[id] = {
              id,
              x: +p[0],
              y: +p[1],
              z: +p[2],
              type: p[3],
              inputs: [+p[4], +p[5]],
            };
          }
        }

        const cube = new THREE.BoxGeometry(0.6, 0.6, 0.6);

        for (const node of Object.values(nodes)) {
          const mesh = new THREE.Mesh(
            cube,
            new THREE.MeshPhongMaterial({
              color: gateColor(node.type),
            }),
          );

          mesh.position.set(node.x, node.y, node.z);

          scene.add(mesh);
          objects.push(mesh);

          for (const input of node.inputs) {
            const src = nodes[input];
            if (!src) continue;

            const geo = new THREE.BufferGeometry().setFromPoints([
              new THREE.Vector3(src.x, src.y, src.z),
              new THREE.Vector3(node.x, node.y, node.z),
            ]);

            const line = new THREE.Line(
              geo,
              new THREE.LineBasicMaterial({
                color: 0xffffff,
              }),
            );

            scene.add(line);
            objects.push(line);
          }
        }

        scene.add(new THREE.GridHelper(40, 40));
      }

      document.getElementById("render").onclick = renderCircuit;

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
